<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade Boundaries – IB Survival Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="site-header">
  <div class="container">
    <div class="header-row">
      <a class="brand" href="index.html">
        <span class="brand-dot"></span>
        <span class="brand-title">IB Survival Hub</span>
      </a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="subjects.html">Subjects</a>
        <a href="planner.html">Planner</a>
        <a href="quiz.html">Study Quiz</a>
        <a href="resources.html">Resources</a>
        <a href="boundaries.html">Boundaries</a>
      </nav>
    </div>
  </div>
</header>

<main class="page">
  <div class="container">

    <section class="hero card">
      <div class="card-inner">
        <h1>IB Grade Boundaries</h1>
        <p class="kicker">
          Based on May 2023 – Time Zone A (includes Ontario, Canada).
        </p>
        <div class="hr"></div>
        <div class="note">
          Boundaries vary by session and time zone. Always verify with your school if uncertain.
        </div>
      </div>
    </section>

    <section class="section">
      <div class="card">
        <div class="card-inner">

          <h2>Select Subject</h2>

          <select id="subjectSelect" class="input">
            <option value="">-- Choose Subject --</option>
            <option value="math">Mathematics AA SL</option>
            <option value="bio">Biology SL</option>
            <option value="chem">Chemistry SL</option>
            <option value="physics">Physics SL</option>
            <option value="econ">Economics HL</option>
            <option value="english">English A</option>
            <option value="psych">Psychology HL</option>
            <option value="business">Business SL</option>
            <option value="history">History HL</option>
            <option value="geo">Geography SL</option>
            <option value="cs">Computer Science SL</option>
            <option value="french">French B SL</option>
          </select>

          <div id="boundaryOutput" style="margin-top:30px;"></div>

        </div>
      </div>
    </section>

  </div>
</main>

<script src="app.jss"></script>
</body>
</html>
