<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IB Grade Boundaries</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page Layout */
    .boundaries-container {
      max-width: 1100px;
      margin: 80px auto;
      padding: 40px;
    }

    .boundaries-container h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      opacity: 0.7;
      margin-bottom: 40px;
    }

    /* Dropdown */
    #subjectSelect {
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      font-size: 16px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(10px);
      margin-bottom: 50px;
    }

    /* Card */
    .boundary-card {
      background: rgba(255,255,255,0.05);
      border-radius: 24px;
      padding: 40px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .boundary-card h2 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 28px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }

    .level h3 {
      margin-bottom: 15px;
      font-size: 18px;
      opacity: 0.8;
    }

    .level ul {
      list-style: none;
      padding: 0;
    }

    .level li {
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      transition: 0.2s ease;
    }

    .level li:hover {
      background: rgba(255,255,255,0.12);
      transform: translateX(4px);
    }

    @media (max-width: 800px) {
      .level-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="nav-container">
    <div class="logo">
      <span class="dot"></span>
      IB Survival Hub
    </div>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="subjects.html">Subjects</a>
      <a href="planner.html">Planner</a>
      <a href="quiz.html">Study Quiz</a>
      <a href="resources.html">Resources</a>
      <a href="boundaries.html" class="active">Boundaries</a>
    </nav>
  </div>
</header>

<div class="boundaries-container">

  <h1>IB Grade Boundaries</h1>
  <div class="subtitle">Based on IB May 2025 (Zone A – Ontario reference)</div>

  <select id="subjectSelect">
    <option value="chem">Chemistry</option>
    <option value="physics">Physics</option>
    <option value="math">Math AA</option>
    <option value="bio">Biology</option>
    <option value="cs">Computer Science</option>
    <option value="econ">Economics</option>
    <option value="business">Business</option>
    <option value="history">History</option>
    <option value="geo">Geography</option>
    <option value="englishA">English A</option>
    <option value="englishB">English B</option>
    <option value="psych">Psychology</option>
  </select>

  <div id="output"></div>

</div>

<script>
const boundaries = {

chem: {
  title: "Chemistry",
  SL: ["7: 71–100","6: 60–70","5: 49–59","4: 38–48","3: 28–37","2: 16–27","1: 0–15"],
  HL: ["7: 74–100","6: 63–73","5: 51–62","4: 40–50","3: 26–39","2: 15–25","1: 0–14"]
},

physics: {
  title: "Physics",
  SL: ["7: 63–100","6: 53–62","5: 42–52","4: 32–41","3: 20–31","2: 12–19","1: 0–11"],
  HL: ["7: 67–100","6: 56–66","5: 45–55","4: 35–44","3: 24–34","2: 13–23","1: 0–12"]
},

math: {
  title: "Math AA",
  SL: ["7: 65–100","6: 52–64","5: 38–51","4: 25–37","3: 15–24","2: 7–14","1: 0–6"],
  HL: ["7: 73–100","6: 60–72","5: 48–59","4: 34–47","3: 24–33","2: 12–23","1: 0–11"]
}

};

function render(subject) {
  const data = boundaries[subject];

  document.getElementById("output").innerHTML = `
    <div class="boundary-card">
      <h2>${data.title}</h2>
      <div class="level-grid">
        <div class="level">
          <h3>Standard Level</h3>
          <ul>${data.SL.map(g => `<li>${g}</li>`).join("")}</ul>
        </div>
        <div class="level">
          <h3>Higher Level</h3>
          <ul>${data.HL.map(g => `<li>${g}</li>`).join("")}</ul>
        </div>
      </div>
    </div>
  `;
}

render("chem");

document.getElementById("subjectSelect")
  .addEventListener("change", e => render(e.target.value));
</script>

</body>
</html>
