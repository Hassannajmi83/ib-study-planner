<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Quiz – IB Survival Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="index.html">IB Survival Hub</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="subjects.html">Subjects</a>
        <a href="planner.html">Planner</a>
        <a class="active" href="quiz.html">Study Quiz</a>
        <a href="resources.html">Resources</a>
        <a href="boundaries.html">Boundaries</a>
      </nav>
    </div>
  </header>

  <main class="page-wrap">
    <section class="card">
      <h1>Study Quiz</h1>
      <p class="muted">Pick a subject, choose number of questions, start the quiz.</p>

      <div class="panel">
        <label class="label">Subject</label>
        <select id="quizSubject" class="input">
          <option>Chemistry</option>
          <option>Physics</option>
          <option>Mathematics AA</option>
        </select>

        <label class="label">Questions</label>
        <select id="quizCount" class="input">
          <option value="5">5</option>
          <option value="8">8</option>
          <option value="10">10</option>
        </select>

        <div class="row mt">
          <button id="startQuizBtn" class="btn primary" type="button">Start Quiz</button>
          <button id="resetQuizBtn" class="btn" type="button" style="display:none;">Reset</button>
        </div>
      </div>

      <div id="quizArea" class="panel mt" style="display:none;">
        <div class="row space">
          <div id="quizMeta" class="muted"></div>
          <div id="quizScore" class="muted"></div>
        </div>

        <div id="quizQuestion" class="quiz-q"></div>
        <div id="quizChoices" class="quiz-choices"></div>

        <div id="quizFeedback" class="muted mt"></div>

        <button id="nextQuizBtn" class="btn mt" type="button" disabled>Next</button>
      </div>

      <div id="quizResult" class="panel mt" style="display:none;">
        <h2>Result</h2>
        <div id="quizResultText" class="muted"></div>
      </div>
    </section>
  </main>

  <script src="quiz.js" defer></script>
</body>
</html>
