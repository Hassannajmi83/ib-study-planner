<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Quiz - IB Survival Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a class="brand" href="index.html">IB Survival Hub</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="subjects.html">Subjects</a>
        <a href="planner.html">Planner</a>
        <a class="active" href="quiz.html">Study Quiz</a>
        <a href="resources.html">Resources</a>
        <a href="boundaries.html">Boundaries</a>
      </nav>
    </div>
  </header>

  <main class="page-wrap">
    <section class="panel" style="max-width:980px; margin:18px auto; padding:18px;">
      <h1 class="h1" style="font-size:38px; margin:0 0 8px;">Study Quiz</h1>
      <p class="sub" style="margin:0 0 14px;">Pick a subject, pick a question count, start the quiz.</p>

      <div class="hr"></div>

      <div class="grid grid-2">
        <div class="card">
          <p class="card-title">Setup</p>

          <label for="quizSubject">Subject</label>
          <select id="quizSubject">
            <option>Chemistry</option>
            <option>Biology</option>
            <option>Physics</option>
            <option>Mathematics AA</option>
            <option>Computer Science</option>
            <option>Economics</option>
            <option>Business Management</option>
            <option>Psychology</option>
            <option>English A Literature</option>
            <option>English B</option>
            <option>Geography</option>
            <option>History</option>
          </select>

          <div style="height:10px;"></div>

          <label for="quizCount">Questions</label>
          <select id="quizCount">
            <option value="5">5</option>
            <option value="8" selected>8</option>
            <option value="10">10</option>
          </select>

          <div style="height:12px;"></div>

          <button id="startQuizBtn" class="btn" type="button">Start Quiz</button>
          <button id="resetQuizBtn" class="btn" type="button" style="display:none; margin-left:8px;">Reset</button>
        </div>

        <div class="card">
          <p class="card-title">Tip</p>
          <p class="card-sub" style="margin:0; line-height:1.6;">
            Use this for quick recall. If you miss a question, write the correct wording once.
          </p>
        </div>
      </div>

      <div style="height:14px;"></div>

      <!-- QUIZ AREA -->
      <section id="quizArea" class="panel-soft" style="display:none; padding:18px; border-radius:22px;">
        <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <div id="quizMeta" class="sub">Question</div>
          <div id="quizScore" class="sub">Score: 0</div>
        </div>

        <div style="height:10px;"></div>

        <div id="quizQuestion" style="font-size:18px; font-weight:700;">Question text</div>

        <div style="height:12px;"></div>

        <div id="quizChoices" class="grid" style="gap:10px;"></div>

        <div style="height:10px;"></div>

        <div id="quizFeedback" class="sub"></div>

        <div style="height:12px;"></div>

        <button id="nextQuizBtn" class="btn" type="button" disabled>Next</button>
      </section>

      <!-- RESULT -->
      <section id="quizResult" class="panel-soft" style="display:none; padding:18px; border-radius:22px;">
        <h2 style="margin:0 0 8px;">Result</h2>
        <p id="quizResultText" class="sub" style="margin:0;"></p>
      </section>

    </section>
  </main>

  <!-- IMPORTANT -->
  <script src="app.js" defer></script>
</body>
</html>
