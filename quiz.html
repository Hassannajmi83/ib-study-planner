<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Quiz - IB Survival Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a class="brand" href="index.html">IB Survival Hub</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="subjects.html">Subjects</a>
        <a href="planner.html">Planner</a>
        <a class="active" href="quiz.html">Study Quiz</a>
        <a href="resources.html">Resources</a>
        <a href="boundaries.html">Boundaries</a>
      </nav>
    </div>
  </header>

  <main class="page-wrap">
    <section class="panel" style="max-width: 980px; margin: 18px auto; padding: 18px;">
      <h1 style="margin:0 0 8px;">Study Quiz</h1>
      <p style="margin:0; opacity:.85;">
        Quick multiple-choice checks for core IB topics. Pick a subject, start the quiz, get a score.
      </p>
    </section>

    <section class="panel" style="max-width: 980px; margin: 14px auto; padding: 16px;">
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <label for="quizSubject" style="opacity:.9; font-size:13px;">Subject</label>
        <select id="quizSubject" style="min-width:260px;">
          <option value="Chemistry">Chemistry</option>
          <option value="Biology">Biology</option>
          <option value="Physics">Physics</option>
          <option value="Mathematics AA">Mathematics AA</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Economics">Economics</option>
          <option value="Business Management">Business Management</option>
          <option value="Psychology">Psychology</option>
          <option value="English A Literature">English A Literature</option>
          <option value="English B">English B</option>
          <option value="Geography">Geography</option>
          <option value="History">History</option>
        </select>

        <label for="quizCount" style="opacity:.9; font-size:13px;">Questions</label>
        <select id="quizCount">
          <option value="5">5</option>
          <option value="8" selected>8</option>
          <option value="10">10</option>
        </select>

        <button id="startQuizBtn" class="btn" type="button">Start Quiz</button>
        <button id="resetQuizBtn" class="btn" type="button" style="display:none;">Reset</button>
      </div>
    </section>

    <!-- QUIZ AREA -->
    <section id="quizArea" class="panel" style="max-width: 980px; margin: 14px auto; padding: 16px; display:none;">
      <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;">
        <div id="quizMeta" style="opacity:.9; font-size:13px;">Question 1 / 8</div>
        <div id="quizScore" style="opacity:.9; font-size:13px;">Score: 0</div>
      </div>

      <hr style="border:none; border-top:1px solid rgba(255,255,255,.12); margin:12px 0;" />

      <h2 id="quizQuestion" style="margin:0 0 10px; font-size:18px; line-height:1.35;">Question text…</h2>

      <div id="quizChoices" style="display:grid; gap:10px;"></div>

      <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
        <button id="nextQuizBtn" class="btn" type="button" disabled>Next</button>
        <div id="quizFeedback" style="opacity:.85; font-size:13px; align-self:center;"></div>
      </div>
    </section>

    <!-- RESULT AREA -->
    <section id="quizResult" class="panel" style="max-width: 980px; margin: 14px auto; padding: 16px; display:none;">
      <h2 style="margin:0 0 8px;">Result</h2>
      <p id="quizResultText" style="margin:0; opacity:.9;"></p>
    </section>
  </main>

  <!-- IMPORTANT: defer so the button works reliably -->
  <script src="app.js" defer></script>
</body>
</html>
