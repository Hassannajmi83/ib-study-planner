<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Study Quiz — IB Survival Hub</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="app.js"></script>
  <script defer src="quiz.js"></script>

  <!-- Fix: keep technique options INSIDE the box (override any .out layout rules) -->
  <style>
    /* This box should behave like a normal block container, not inherit weird .out layout (grid/columns/etc). */
    .techBox {
      display: block !important;
      width: 100%;
      overflow: hidden;
    }

    .techBox .techItem {
      display: flex !important;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      width: 100%;
      max-width: 100%;
      white-space: normal;
    }

    .techBox .techItem input[type="checkbox"] {
      flex: 0 0 auto;
    }

    .techBox .techItem span {
      display: inline-block;
      flex: 1 1 auto;
      min-width: 0;
    }
  </style>
</head>

<body>
  <header class="siteHeader">
    <div class="navWrap">
      <a class="brand" href="index.html"><span class="brandDot"></span>IB Survival Hub</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="subjects.html">Subjects</a>
        <a href="planner.html">Planner</a>
        <a href="quiz.html">Study Quiz</a>
        <a href="resources.html">Resources</a>
        <a href="boundaries.html">Boundaries</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="panel">
      <h1>Study Quiz</h1>
      <p class="muted">Quick check → recommends study method + weekly routine based on your answers.</p>

      <div class="hr"></div>

      <div class="row">
        <div>
          <label>How many hours do you realistically have per day?</label>
          <select id="qHours">
            <option value="">Select…</option>
            <option>0–1</option>
            <option>1–2</option>
            <option>2–3</option>
            <option>3–4</option>
            <option>4+</option>
          </select>

          <label>How many chapters / units are you behind?</label>
          <select id="qBehind">
            <option value="">Select…</option>
            <option>0–1</option>
            <option>2–3</option>
            <option>4–6</option>
            <option>7+</option>
          </select>

          <label>Which techniques do you currently use? (Select all that apply)</label>

          <!-- IMPORTANT CHANGE:
               This is no longer class="out" (because .out styling is breaking the layout).
               We keep the same "box look" by leaving .out AND adding .techBox overrides above. -->
          <div class="out techBox" style="margin-top:8px">
            <label class="techItem"><input type="checkbox" value="reread" class="tech"><span>Re-reading notes / highlighting</span></label>
            <label class="techItem"><input type="checkbox" value="active" class="tech"><span>Active recall (testing yourself)</span></label>
            <label class="techItem"><input type="checkbox" value="spaced" class="tech"><span>Spaced repetition</span></label>
            <label class="techItem"><input type="checkbox" value="past" class="tech"><span>Past paper questions</span></label>
            <label class="techItem"><input type="checkbox" value="pomodoro" class="tech"><span>Pomodoro sessions</span></label>
          </div>

          <label>When you do practice questions, what happens most?</label>
          <select id="qPractice">
            <option value="">Select…</option>
            <option value="avoid">I avoid them / do too little</option>
            <option value="stuck">I get stuck and waste time</option>
            <option value="random">I do them randomly</option>
            <option value="review">I do them + review mistakes</option>
          </select>

          <label>Biggest issue right now?</label>
          <select id="qIssue">
            <option value="">Select…</option>
            <option value="time">Time management</option>
            <option value="focus">Focus / procrastination</option>
            <option value="understand">Not understanding content</option>
            <option value="memory">Forgetting quickly</option>
          </select>

          <button id="btnQuiz">Generate my study method</button>
        </div>

        <div>
          <div id="quizOut" class="out">
            <div class="muted">Answer the questions and press the button.</div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
