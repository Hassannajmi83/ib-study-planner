<!-- subjects.html (FULL FILE) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Subjects — IB Survival Hub</title>
  <meta name="description" content="Pick a subject. Each page has paper structure, study strategy, and common mark traps." />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Header gets injected by app.js -->
  <div id="siteHeader"></div>

  <main class="page">
    <section class="heroCard">
      <h1 class="heroTitle">Subjects</h1>
      <p class="heroSub">
        Pick a subject. Each page has papers + study strategy + common mark traps.
      </p>
      <p class="heroHint">
        Tip: if a link 404s, it’s usually a filename/case mismatch (e.g., English.html vs english.html).
      </p>
    </section>

    <section class="section">
      <div class="gridCards" id="subjectsGrid">
        <!-- Filled by JS (fallback below if JS blocked) -->
        <noscript>
          <div class="notice">
            JavaScript is off — here are direct links:
            <ul>
              <li><a href="chem.html">Chemistry</a></li>
              <li><a href="bio.html">Biology</a></li>
              <li><a href="physics.html">Physics</a></li>
              <li><a href="math.html">Math AA</a></li>
              <li><a href="econ.html">Economics</a></li>
              <li><a href="psych.html">Psychology</a></li>
              <li><a href="English.html">English Literature</a></li>
              <li><a href="history.html">History</a></li>
              <li><a href="business.html">Business</a></li>
              <li><a href="geo.html">Geography</a></li>
              <li><a href="cs.html">Computer Science</a></li>
              <li><a href="french.html">French</a></li>
            </ul>
          </div>
        </noscript>
      </div>
    </section>
  </main>

  <script src="app.js" defer></script>
  <script>
    // Build subject cards from subjects.json (preferred).
    // If subjects.json fails, fallback to a hardcoded list.
    (async function () {
      const grid = document.getElementById("subjectsGrid");

      const fallback = [
        { id: "chem",   name: "Chemistry",          href: "chem.html",    tagline: "Papers + calculations + marksheme wording" },
        { id: "bio",    name: "Biology",            href: "bio.html",     tagline: "Keywords, data response, command terms" },
        { id: "physics",name: "Physics",            href: "physics.html", tagline: "Diagrams, method marks, clean assumptions" },
        { id: "math",   name: "Math AA",            href: "math.html",    tagline: "SL vs HL structure + common error traps" },
        { id: "econ",   name: "Economics",          href: "econ.html",    tagline: "SL vs HL + diagrams + evaluation" },
        { id: "psych",  name: "Psychology",         href: "psych.html",   tagline: "Studies bank + SAQ/ERQ structure" },
        { id: "eng",    name: "English Literature", href: "English.html", tagline: "Paper 1 unseen analysis + Paper 2 comparison" },

        { id: "history", name: "History",           href: "history.html", tagline: "Evidence, argument, source analysis" },
        { id: "business",name: "Business",          href: "business.html",tagline: "Case application + evaluation + recommendation" },
        { id: "geo",     name: "Geography",         href: "geo.html",     tagline: "Case studies + models + evaluation" },
        { id: "cs",      name: "Computer Science",  href: "cs.html",      tagline: "Tracing + pseudocode + trade-offs" },
        { id: "french",  name: "French",            href: "french.html",  tagline: "Consistency + writing structure + vocab growth" },
      ];

      function render(list) {
        grid.innerHTML = "";
        list.forEach(s => {
          const a = document.createElement("a");
          a.className = "cardLink";
          a.href = s.href;

          a.innerHTML = `
            <div class="card">
              <div class="cardTitle">${escapeHtml(s.name)}</div>
              <div class="cardMeta">${escapeHtml(s.tagline || "")}</div>
              <div class="cardCta">Open →</div>
            </div>
          `;
          grid.appendChild(a);
        });
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({
          "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
        }[m]));
      }

      try {
        const res = await fetch("subjects.json", { cache: "no-store" });
        if (!res.ok) throw new Error("subjects.json not found");
        const data = await res.json();

        // Accept either {subjects:[...]} or just [...]
        const list = Array.isArray(data) ? data : (data.subjects || []);
        if (!list.length) throw new Error("subjects.json empty");

        // Normalize: expect {name, href, tagline}
        const normalized = list.map(x => ({
          name: x.name || x.title || "Subject",
          href: x.href || x.link || "#",
          tagline: x.tagline || x.subtitle || ""
        }));

        render(normalized);
      } catch (e) {
        render(fallback);
      }
    })();
  </script>
</body>
</html>
